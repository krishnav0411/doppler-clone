name: Build iOS IPA

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate Xcode Project
        run: xcodegen generate

      - name: Build and Package App Bundle
        run: |
          mkdir -p build/Payload
          
          xcodebuild build \
            -project Orion.xcodeproj \
            -scheme Orion \
            -destination "generic/platform=iOS" \
            -configuration Release \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            BUILD_DIR="$(pwd)/build/derived"
          
          APP_PATH=$(find build/derived -name "Orion.app" -type d | head -n 1)
          
          if [ -z "$APP_PATH" ]; then
            APP_PATH=$(find build/derived -name "*.app" -type d | head -n 1)
          fi
          
          if [ -z "$APP_PATH" ]; then
            echo "Error: .app file not found"
            exit 1
          fi
          
          echo "Found app at: $APP_PATH"
          cp -R "$APP_PATH" build/Payload/
          
          cd build
          zip -r Orion.ipa Payload
          cd ..

      - name: Upload IPA Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Orion-iOS-IPA
          path: build/Orion.ipa
          retention-days: 7
