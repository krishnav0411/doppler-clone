name: Orion
options:
  bundleIdPrefix: com.paneer
  deploymentTarget:
    iOS: "17.0"
targets:
  Orion:
    type: application
    platform: iOS
    sources:
      - path: Sources/DopplerCore
      - path: Sources/DopplerUI
      - path: Sources/App
    settings:
      PRODUCT_BUNDLE_IDENTIFIER: com.paneer.orion
      PRODUCT_NAME: Orion
      INFOPLIST_FILE: Info.plist
      CURRENT_PROJECT_VERSION: 1
      MARKETING_VERSION: 1.0
      SWIFT_VERSION: "5.9"
      CODE_SIGN_STYLE: Manual
      CODE_SIGN_IDENTITY: ""
      CODE_SIGNING_REQUIRED: NO
      CODE_SIGNING_ALLOWED: NO
